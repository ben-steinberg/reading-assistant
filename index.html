<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            font-family: 'Hiragino Sans', 'Meiryo', sans-serif; 
            padding: 100px 50px; /* Lots of top room for stacked hints */
            line-height: 5;      /* Increased to 5 to prevent line overlap */
            background-color: #fcfcfc;
        }
    
        #article { max-width: 800px; margin: 0 auto; font-size: 24px; }
    
        .word-block {
            position: relative;
            display: inline-block;
            cursor: pointer;
            padding: 0 2px;
            z-index: 1;
        }
    
        rt, .eng-hint { 
            visibility: hidden; 
            opacity: 0;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            width: max-content;
            pointer-events: none;
            transition: opacity 0.2s;
            text-align: center;
        }
        
        /* called ruby text */
        rt { 
            top: 2.0em;
            font-size: 0.55em;
            color: #3498db; 
            display: block;
        }
    
        .eng-hint {
            top: -1.0em;   
            color: #8e44ad; 
            font-size: 0.5em; 
            font-weight: normal;
            background: none; 
            padding: 0;
        }
    
        .state-1 rt { visibility: visible; opacity: 1; }
        
        .state-2 rt { visibility: visible; opacity: 1; }
        .state-2 .eng-hint { visibility: visible; opacity: 1; }
    
        .word-block:hover { 
            background-color: #f0f7ff; 
            border-radius: 4px; 
        }
    </style>
</head>
<body>

    <div id="article">
        {% for word in words %}
            <span class="word-block state-0" 
                  data-is-kanji="{{ 'true' if word.is_kanji else 'false' }}" 
                  onclick="toggleState(this)">
                <ruby>
                    {{ word.orig }}
                    <rt>{{ word.hira }}</rt>
                </ruby>
                <span class="eng-hint">{{ word.english }}</span>
            </span>
        {% endfor %}
    </div>

    <div id="metadata" data-total-words = "{{ total_words }}" style="display: none;"></div>

    <div id="status-bar" style="position: fixed; top: 0; width: 100%; background: #eee; padding: 10px; z-index: 1000;">
        Reading Level: <strong>{{ difficulty }}</strong> 
        Lookup Rate:<span id="lookup-percentage">0</span>%
    </div>

    <div style="text-align: center; margin-top: 50px;">
        <button id="finish-btn" 
                onclick="submitSession()" 
                style="padding: 15px 30px; font-size: 20px; cursor: pointer; border-radius: 8px; background-color: #2ecc71; color: white; border: none;">
            Are you finished reading?
        </button>
    </div>
    
    <script>
        let uniqueClicks = new Set();
    
        function updateStats(wordText) {
            const metadata = document.getElementById('metadata');
            const totalWords = parseInt(metadata.getAttribute('data-total-words')) || 1; 
            
            uniqueClicks.add(wordText);
            
            let percentage = ((uniqueClicks.size / totalWords) * 100).toFixed(1);
            
            const display = document.getElementById('lookup-percentage');
            if (display) {
                display.innerText = percentage;
                console.log(`Word: ${wordText} | Unique Count: ${uniqueClicks.size} | Total: ${totalWords} | %: ${percentage}`);
            }
        }

        function submitSession() {
            const percentageValue = document.getElementById('lookup-percentage').innerText;
            const difficultyValue = "{{ difficulty_score }}"; 

            const url = `/log_reading_session?percentage=${percentageValue}&difficulty=${encodeURIComponent(difficultyValue)}`;

            fetch(url, { method: 'POST' })
                .then(response => {
                    if(response.ok) {
                        alert("Session Saved! Lookups: " + percentageValue + "%");
                        document.getElementById('finish-btn').innerText = "Saved! ✅";
                        document.getElementById('finish-btn').disabled = true;
                    } else {
                        alert("Could not save session.");
                    }
                })
                .catch(err => console.error("Network Error:", err));
        }
    
        function toggleState(el) {
            const isKanji = el.getAttribute('data-is-kanji') === 'true';
            let currentState = parseInt(el.getAttribute('data-state') || "0");
            let nextState;
    
            if (isKanji) {
                nextState = (currentState + 1) % 3;
            } else {
                nextState = (currentState === 0) ? 2 : 0;
            }

            // fix it so that it updates the percentage when you ask for the second hint as well
    
            const wordText = el.querySelector('ruby').childNodes[0].textContent.trim();
            
            fetch(`/log_click/${encodeURIComponent(wordText)}`, { method: 'POST' });

            updateStats(wordText);
    
            if (nextState !== 0) {
                document.querySelectorAll('.word-block').forEach(word => {
                    if (word !== el) {
                        word.setAttribute('data-state', '0');
                        word.className = 'word-block state-0';
                    }
                });
            }
    
            
            el.setAttribute('data-state', nextState);
            el.className = `word-block state-${nextState}`;
        }
    </script>
    
</body>
</html>
